name: OrangeFox Build

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/vinokesunean-art/android_device_tecno_kn3'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'master'
      DEVICE_PATH:
        description: 'Path target tree di source root'
        required: true
        default: 'device/tecno/kn3'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'kn3'
      BUILD_TARGET:
        description: 'Partition target'
        type: choice
        options:
          - vendor_boot
          - recovery
          - boot
        required: true
        default: 'vendor_boot'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Notify Build Started
      run: |
        curl -s -X POST "https://api.telegram.org/bot8950911881:AAEnwtyKg7boHfNWeL97O2y0NkoijzhJ13w/sendMessage" \
          -d chat_id="-1004386707383" \
          -d parse_mode="HTML" \
          -d text="Start Building ofox! 🚀%0A%0ARepo: https://github.com/${{ github.repository }}%0ACommit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}%0ALog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Prepare the Environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
          liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop \
          pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libtinfo5
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Set up OrangeFox fox-14.1 Sources (Official Sync)
      run: |
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync /tmp/ofox-sync
        cd /tmp/ofox-sync
        ./orangefox_sync.sh -b 14.1 -p ${GITHUB_WORKSPACE}/workspace

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        git clone -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_TREE_URL }} ${{ inputs.DEVICE_PATH }}

    - name: Apply Device Patches (If Exists)
      run: |
        if [ -d "${GITHUB_WORKSPACE}/workspace/${{ inputs.DEVICE_PATH }}/patches" ]; then
          cd ${GITHUB_WORKSPACE}/workspace/${{ inputs.DEVICE_PATH }}/patches
          find . -type f -print0 | xargs -0 cp -f --parents -t ${GITHUB_WORKSPACE}/workspace
        fi

    - name: Fix CTS Release Version Check
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        grep -q '^16\.1\.0$' cts/tests/tests/os/assets/platform_releases.txt || echo '16.1.0' >> cts/tests/tests/os/assets/platform_releases.txt

    - name: Building OrangeFox
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
        lunch fox_${{ inputs.DEVICE_NAME }}-eng || lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        export JOBS=2
        mka adbd $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image -j2
      working-directory: workspace

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ofox-${{ inputs.BUILD_TARGET }}
        path: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.md5
        if-no-files-found: warn

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.md5
        name: ${{ inputs.DEVICE_NAME }} OrangeFox Recovery
        tag_name: build-${{ github.run_id }}
        body: |
          Manifest: fox-14.1
          Target: ${{ inputs.BUILD_TARGET }}.img
          Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Telegram Notification
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        run: |
          CONCLUSION="${{ needs.build.result }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "$CONCLUSION" = "success" ]; then
            MSG="Ofox Status Passed! ✅%0A%0ARepo: ${REPO_URL}%0ACommit: ${COMMIT_URL}%0ALog: ${LOG_URL}"
          elif [ "$CONCLUSION" = "cancelled" ]; then
            MSG="y gw stop 🥸%0A%0ARepo: ${REPO_URL}%0ACommit: ${COMMIT_URL}%0ALog: ${LOG_URL}"
          else
            MSG="Build Gagal! Silahkan Periksa Log ❌%0A%0ARepo: ${REPO_URL}%0ACommit: ${COMMIT_URL}%0ALog: ${LOG_URL}"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot8950911881:AAEnwtyKg7boHfNWeL97O2y0NkoijzhJ13w/sendMessage" \
            -d chat_id="-1004386707383" \
            -d parse_mode="HTML" \
            -d text="$MSG"
